<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alida — While you grieve, Alida takes care of everything else.</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a87c;
    --gold-light: #e2c9a0;
    --pearl: #f5efe8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow-x: hidden; font-family: 'Jost', sans-serif; }

  body {
    background: #0a0a12;
    min-height: 100vh;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 2rem 1.5rem;
  }

  .logo-wrap {
    opacity: 0;
    text-align: center;
    margin-bottom: 2.4rem;
    position: relative;
    transition: opacity 2s ease;
    display: inline-block;
  }

  .logo-compose {
    position: relative;
    display: inline-block;
    width: min(420px, 74vw);
  }

  .logo-text {
    width: 100%;
    display: block;
    position: relative;
    z-index: 2;
  }

  .logo-wing {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    z-index: 3;
    transform-origin: 42% 56%;
    animation: wingFlutter 3.5s ease-in-out infinite;
    animation-play-state: paused;
  }

  .logo-wing.flutter {
    animation-play-state: running;
  }

  @keyframes wingFlutter {
    0%   { transform: rotate(0deg) translateY(0px) scaleY(1); }
    18%  { transform: rotate(-1deg) translateY(-3px) scaleY(0.98); }
    34%  { transform: rotate(0.4deg) translateY(-1px) scaleY(1); }
    50%  { transform: rotate(0deg) translateY(0px) scaleY(1); }
    66%  { transform: rotate(0.7deg) translateY(-2px) scaleY(0.99); }
    82%  { transform: rotate(-0.3deg) translateY(-1px) scaleY(1); }
    100% { transform: rotate(0deg) translateY(0px) scaleY(1); }
  }



  .tagline {
    opacity: 0;
    text-align: center;
    max-width: 540px;
    transition: opacity 2s ease 0.4s;
  }

  .tagline h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.85rem);
    color: var(--pearl);
    letter-spacing: 0.025em;
    line-height: 1.55;
    margin-bottom: 1rem;
  }

  .tagline p {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: clamp(0.68rem, 1.7vw, 0.82rem);
    color: var(--gold);
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }

  .divider {
    opacity: 0;
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, transparent, rgba(201,168,124,0.4), transparent);
    margin: 1.8rem auto 2.2rem;
    transition: opacity 1.5s ease 0.7s;
  }

  .waitlist {
    opacity: 0;
    width: 100%; max-width: 380px;
    text-align: center;
    transition: opacity 2s ease 0.9s;
  }

  .waitlist-label {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(201,168,124,0.55);
    margin-bottom: 1.8rem;
  }

  .form-group { display: flex; flex-direction: column; gap: 1rem; }

  .form-group input {
    background: rgba(255,245,235,0.04);
    border: none;
    border-bottom: 1px solid rgba(201,168,124,0.22);
    padding: 0.8rem 0.4rem;
    color: var(--pearl);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    outline: none;
    transition: border-color 0.35s, background 0.35s;
    text-align: center;
    width: 100%;
  }

  .form-group input::placeholder { color: rgba(201,168,124,0.28); letter-spacing: 0.14em; }
  .form-group input:focus { border-bottom-color: var(--gold); background: rgba(201,168,124,0.05); }

  .btn-join {
    margin-top: 2rem;
    background: transparent;
    border: 1px solid rgba(201,168,124,0.38);
    color: var(--gold);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    padding: 1rem 3rem;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    display: inline-block;
  }

  .btn-join::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(201,168,124,0.07);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease;
  }

  .btn-join:hover::before { transform: scaleX(1); }
  .btn-join:hover { border-color: var(--gold); color: var(--gold-light); }

  .success-msg {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 300;
    font-size: 1.2rem; color: var(--gold-light);
    letter-spacing: 0.04em; line-height: 1.7; padding: 1.4rem 0;
  }

  .footnote {
    opacity: 0;
    position: fixed; bottom: 1.6rem; left: 0; right: 0;
    text-align: center;
    font-family: 'Jost', sans-serif; font-weight: 200;
    font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(201,168,124,0.2);
    transition: opacity 2s ease 1.6s; z-index: 2;
  }

  @media (max-width: 480px) {
    .logo-compose { width: 82vw; }
    .tagline h2 { font-size: 1.2rem; }
    .btn-join { width: 100%; padding: 1rem; }
  }
</style>
</head>
